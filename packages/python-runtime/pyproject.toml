[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "soaiacore-runtime"
version = "0.1.0"
description = "Shared SOAIACORE P0 runtime contracts, persistence, and lifecycle"
requires-python = ">=3.12,<3.13"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "jsonschema>=4.23,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/soaiacore_runtime"]

