[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "soaiacore-core"
version = "0.1.0"
description = "SOAIACORE P0 FastAPI Core runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "soaiacore-runtime",
  "uvicorn>=0.34,<1",
]

[project.scripts]
soaiacore-core = "soaiacore_core.__main__:main"

[tool.uv.sources]
soaiacore-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/soaiacore_core"]

