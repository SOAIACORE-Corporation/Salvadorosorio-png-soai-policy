name: OCI Build, Scan, and Publish

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/oci-build-publish.yml
      - .trivyignore.yaml
      - apps/**
      - packages/**
      - schemas/**
      - contracts/**
      - db/migrations/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .python-version
  push:
    branches:
      - main
    paths:
      - .github/workflows/oci-build-publish.yml
      - .trivyignore.yaml
      - apps/**
      - packages/**
      - schemas/**
      - contracts/**
      - db/migrations/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .python-version

permissions:
  contents: read

concurrency:
  group: oci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ghcr.io/soaiacore-corporation/soaiacore-core
  WEB_IMAGE: ghcr.io/soaiacore-corporation/soaiacore-web
  WORKER_IMAGE: ghcr.io/soaiacore-corporation/soaiacore-worker

jobs:
  build-test-scan:
    name: Build, test, and security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: soaiacore
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soaiacore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14

      - name: Test Core and Worker runtime
        env:
          SOAIACORE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/soaiacore
          SOAIACORE_PROVIDER_MODE: MOCK
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.5
          uv sync --frozen
          uv run --frozen pytest -q

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Test and build Web BFF
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Core for linux/amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/core/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: VCS_REF=${{ github.sha }}
          tags: ${{ env.CORE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=core-amd64
          cache-to: type=gha,mode=max,scope=core-amd64

      - name: Build Web for linux/amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: VCS_REF=${{ github.sha }}
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64

      - name: Build Worker for linux/amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: VCS_REF=${{ github.sha }}
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=worker-amd64
          cache-to: type=gha,mode=max,scope=worker-amd64

      - name: Inventory Core HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.CORE_IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-core-risk.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Inventory Web HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-web-risk.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Inventory Worker HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-worker-risk.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Gate Core on fixable HIGH/CRITICAL vulnerabilities and secrets
        id: scan_core
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.CORE_IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-core-gate.json
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore.yaml

      - name: Gate Web on fixable HIGH/CRITICAL vulnerabilities and secrets
        id: scan_web
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-web-gate.json
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore.yaml

      - name: Gate Worker on fixable HIGH/CRITICAL vulnerabilities and secrets
        id: scan_worker
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-worker-gate.json
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy gate and risk inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-security-evidence-${{ github.sha }}
          path: trivy-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce fixable HIGH/CRITICAL security gate
        if: always()
        env:
          CORE_SCAN: ${{ steps.scan_core.outcome }}
          WEB_SCAN: ${{ steps.scan_web.outcome }}
          WORKER_SCAN: ${{ steps.scan_worker.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "${CORE_SCAN}" = success
          test "${WEB_SCAN}" = success
          test "${WORKER_SCAN}" = success

      - name: Save exactly the scanned images for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker save \
            -o oci-images-${GITHUB_SHA}.tar \
            "${CORE_IMAGE}:${GITHUB_SHA}" \
            "${WEB_IMAGE}:${GITHUB_SHA}" \
            "${WORKER_IMAGE}:${GITHUB_SHA}"

      - name: Upload scanned OCI image bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-scanned-images-${{ github.sha }}
          path: oci-images-${{ github.sha }}.tar
          if-no-files-found: error
          retention-days: 1

      - name: Record validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## OCI validation and security gate'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Platform: `linux/amd64`'
            echo '- PR credentials: `contents: read` only'
            echo '- Trivy gate: `HIGH,CRITICAL`, fixable only'
            echo '- Trivy risk inventory: `HIGH,CRITICAL`, including unfixed'
            echo '- Azure OIDC permission: `NOT PRESENT`'
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish previously scanned immutable images
    needs: build-test-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the scanned OCI image bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: oci-scanned-images-${{ github.sha }}

      - name: Load exactly the scanned images
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "oci-images-${GITHUB_SHA}.tar"
          docker image inspect "${CORE_IMAGE}:${GITHUB_SHA}" >/dev/null
          docker image inspect "${WEB_IMAGE}:${GITHUB_SHA}" >/dev/null
          docker image inspect "${WORKER_IMAGE}:${GITHUB_SHA}" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR after the security gate passed
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit tags and capture immutable digests
        shell: bash
        run: |
          set -euo pipefail
          docker push "${CORE_IMAGE}:${GITHUB_SHA}"
          docker push "${WEB_IMAGE}:${GITHUB_SHA}"
          docker push "${WORKER_IMAGE}:${GITHUB_SHA}"

          resolve_digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" { print $2; exit }'
          }
          core_digest="$(resolve_digest "${CORE_IMAGE}:${GITHUB_SHA}")"
          web_digest="$(resolve_digest "${WEB_IMAGE}:${GITHUB_SHA}")"
          worker_digest="$(resolve_digest "${WORKER_IMAGE}:${GITHUB_SHA}")"
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "${core_digest}" =~ ${digest_pattern} ]]
          [[ "${web_digest}" =~ ${digest_pattern} ]]
          [[ "${worker_digest}" =~ ${digest_pattern} ]]

          {
            echo "CORE_DIGEST=${core_digest}"
            echo "WEB_DIGEST=${web_digest}"
            echo "WORKER_DIGEST=${worker_digest}"
          } >> "${GITHUB_ENV}"

          jq -n \
            --arg commit "${GITHUB_SHA}" \
            --arg platform "linux/amd64" \
            --arg core "${CORE_IMAGE}@${core_digest}" \
            --arg web "${WEB_IMAGE}@${web_digest}" \
            --arg worker "${WORKER_IMAGE}@${worker_digest}" \
            '{schema_version:"P0-OCI-2",commit:$commit,platform:$platform,security_gate:"HIGH_CRITICAL_FIXABLE_PASS",live_provider_calls:0,images:{core:$core,web:$web,worker:$worker}}' \
            > oci-publish-receipt.json

      - name: Upload OCI publish receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-publish-receipt-${{ github.sha }}
          path: oci-publish-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify authenticated private-read access by digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          private_config="$(mktemp -d)"
          trap 'rm -rf "${private_config}"' EXIT
          printf '%s' "${GHCR_TOKEN}" |
            DOCKER_CONFIG="${private_config}" docker login ghcr.io \
              --username "${GITHUB_ACTOR}" --password-stdin
          DOCKER_CONFIG="${private_config}" docker buildx imagetools inspect "${CORE_IMAGE}@${CORE_DIGEST}"
          DOCKER_CONFIG="${private_config}" docker buildx imagetools inspect "${WEB_IMAGE}@${WEB_DIGEST}"
          DOCKER_CONFIG="${private_config}" docker buildx imagetools inspect "${WORKER_IMAGE}@${WORKER_DIGEST}"

      - name: Record deployment-ready references
        shell: bash
        run: |
          {
            echo '## Immutable OCI references after security gate'
            echo
            echo "- Core: \`${CORE_IMAGE}@${CORE_DIGEST}\`"
            echo "- Web: \`${WEB_IMAGE}@${WEB_DIGEST}\`"
            echo "- Worker: \`${WORKER_IMAGE}@${WORKER_DIGEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Platform: `linux/amd64`'
            echo '- Authenticated private-read: `PASS`'
            echo '- LIVE_PROVIDER_CALLS: `0`'
            echo '- Azure OIDC permission: `NOT PRESENT`'
          } >> "${GITHUB_STEP_SUMMARY}"
