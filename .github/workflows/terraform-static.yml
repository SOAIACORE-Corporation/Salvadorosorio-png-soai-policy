name: Terraform Static Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/terraform-static.yml
      - infra/azure/**

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt and bootstrap validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Terraform 1.15.0
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: Check Terraform formatting across Azure modules
        run: terraform fmt -check -diff -recursive infra/azure

      - name: Initialize remote-state bootstrap without backend
        run: terraform -chdir=infra/azure/state-bootstrap init -backend=false -input=false

      - name: Validate remote-state bootstrap
        run: terraform -chdir=infra/azure/state-bootstrap validate -no-color

      - name: Parse governed P0 teardown PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'infra/azure/p0/Invoke-P0GovernedTeardown.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify governed teardown fail-safe invariants
        shell: pwsh
        run: |
          $path = 'infra/azure/p0/Invoke-P0GovernedTeardown.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          $required = @(
            '[string]$Mode = ''PlanOnly''',
            '108eb4dd-25b3-4a7f-8d5e-4ec4389c3f0d',
            'rg-soaiacore-p0-34utxi',
            'rg-soaiacore-tfstate-34utxi',
            'remote_backend_initialized',
            'plan_no_destroy_verified',
            'config_state_reconciled',
            'terraform plan -destroy',
            'STOP_PLAN_HASH_MISMATCH',
            'STOP_PRE_APPLY_PLAN_HASH_MISMATCH',
            'STOP_PLAN_SCOPE_MISMATCH',
            'STOP_STATE_BACKEND_DELETE',
            'STOP_ARTIFACT_COLLISION',
            'STOP_ARTIFACT_REPARSE_POINT',
            'STOP_ARTIFACT_ROOT_UNTRUSTED',
            'STOP_ARTIFACT_ANCESTOR_UNTRUSTED',
            'Assert-DestroyPlanScope',
            'Assert-NoReparsePointInPath',
            'Assert-TrustedOperatorDirectory',
            'Assert-TrustedArtifactAncestorChain',
            'Get-CanonicalArtifactRoot',
            '.soaiacore-governed-artifacts',
            'Custom ArtifactRoot is disabled',
            'Artifact ancestor grants write/delete control to another principal',
            'Artifact ancestor is writable by group/other principals',
            'Protect-OperatorDirectory $governedParent',
            'Protect-OperatorDirectory $canonicalRoot',
            '[guid]::NewGuid().ToString(''N'')',
            'New-Item -ItemType Directory -Path $outputDir -ErrorAction Stop',
            'New-SecureArtifactDirectory',
            'Copy-Item -LiteralPath $sourcePlanFile -Destination $stagedPlanFile -ErrorAction Stop',
            '$sourcePlanFile = $null',
            '$PlanFile = $null',
            'terraform show -json $stagedPlanFile',
            'Get-FileHash -LiteralPath $stagedPlanFile',
            'terraform apply -input=false $stagedPlanFile',
            'CANONICAL_ARTIFACT_ROOT=true',
            'ARTIFACT_ANCESTOR_CHAIN_VERIFIED=true',
            'REVIEWED_PLAN_ANCESTOR_CHAIN_VERIFIED=true',
            'REVIEWED_PLAN_SOURCE_REOPENED_AFTER_STAGING=false',
            'chmod 700',
            'chmod 600',
            'PLAN_SCOPE_VERIFIED=true',
            'APPLY_REVIEWED_P0_DESTROY_PLAN',
            'Salvador Osorio Ayala',
            'AuthorizationEvidenceRef',
            'state_backend_preserved'
          )

          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              Write-Error "Missing required teardown safeguard: $needle"
              exit 1
            }
          }

          $forbidden = @(
            'terraform destroy',
            'terraform apply -input=false $PlanFile',
            'New-Item -ItemType Directory -Path $outputDir -Force',
            'Protect-OperatorDirectory $resolvedRoot'
          )

          foreach ($needle in $forbidden) {
            if ($text.Contains($needle)) {
              Write-Error "Forbidden teardown pattern present: $needle"
              exit 1
            }
          }
