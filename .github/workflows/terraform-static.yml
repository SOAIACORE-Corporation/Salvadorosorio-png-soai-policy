name: Terraform Static Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/terraform-static.yml
      - infra/azure/**

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt and bootstrap validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Terraform 1.15.0
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: Check Terraform formatting across Azure modules
        run: terraform fmt -check -diff -recursive infra/azure

      - name: Initialize remote-state bootstrap without backend
        run: terraform -chdir=infra/azure/state-bootstrap init -backend=false -input=false

      - name: Validate remote-state bootstrap
        run: terraform -chdir=infra/azure/state-bootstrap validate -no-color

      # P0 declares a partial azurerm backend whose identifiers are intentionally
      # untracked. Terraform 1.15 validates those required backend arguments, so
      # P0 runtime validation belongs to the authenticated backend/plan gate, not
      # this secretless bootstrap check.

      - name: Parse governed P0 teardown PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'infra/azure/p0/Invoke-P0GovernedTeardown.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify governed teardown fail-safe invariants
        shell: pwsh
        run: |
          $path = 'infra/azure/p0/Invoke-P0GovernedTeardown.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $required = @(
            '[string]$Mode = ''PlanOnly''',
            '108eb4dd-25b3-4a7f-8d5e-4ec4389c3f0d',
            'rg-soaiacore-p0-34utxi',
            'rg-soaiacore-tfstate-34utxi',
            'remote_backend_initialized',
            'plan_no_destroy_verified',
            'config_state_reconciled',
            'terraform plan -destroy',
            'STOP_PLAN_HASH_MISMATCH',
            'APPLY_REVIEWED_P0_DESTROY_PLAN',
            'terraform apply -input=false $PlanFile',
            'state_backend_preserved'
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              Write-Error "Missing required teardown safeguard: $needle"
              exit 1
            }
          }
          if ($text.Contains('terraform destroy')) {
            Write-Error 'Direct terraform destroy is forbidden; exact saved-plan apply is required.'
            exit 1
          }
