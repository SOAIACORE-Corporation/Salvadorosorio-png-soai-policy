name: SOA Intelligence G2 Safety Golden

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/g2-safety-golden-*'
    paths:
      - .github/workflows/soa-intelligence-g2-safety-golden.yml
      - packages/python-runtime/src/soaiacore_runtime/safety_governance.py
      - packages/python-runtime/src/soaiacore_runtime/golden_eval.py
      - packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py
      - packages/python-runtime/tests/test_alpha_g2_safety.py
      - packages/python-runtime/tests/test_alpha_cognitive_*.py
      - packages/python-runtime/golden/soa-alpha-golden-safety-v0.1.json
      - pyproject.toml
      - uv.lock
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/soa-intelligence-g2-safety-golden.yml
      - packages/python-runtime/src/soaiacore_runtime/safety_governance.py
      - packages/python-runtime/src/soaiacore_runtime/golden_eval.py
      - packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py
      - packages/python-runtime/tests/test_alpha_g2_safety.py
      - packages/python-runtime/tests/test_alpha_cognitive_*.py
      - packages/python-runtime/golden/soa-alpha-golden-safety-v0.1.json
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: g2-safety-golden-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-g2:
    name: G2 zero-tolerance safety gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Enforce authorized R1 file boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -E '^(infra/|db/|db/a2_migrations/|scripts/azure/|.*terraform.*|.*\.tf$)'; then
            echo 'G2_R1_SCOPE_VIOLATION=true'
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(azure|terraform|migration)' | grep -v '^\.github/workflows/soa-intelligence-g2-safety-golden.yml$'; then
            echo 'G2_R1_SCOPE_REVIEW_REQUIRED=true'
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14

      - name: Compile G2 deterministic surfaces
        run: |
          python -m py_compile \
            packages/python-runtime/src/soaiacore_runtime/safety_governance.py \
            packages/python-runtime/src/soaiacore_runtime/golden_eval.py \
            packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py \
            packages/python-runtime/tests/test_alpha_g2_safety.py

      - name: Run G2 safety and existing Alpha contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/python-runtime/src
          SOAIACORE_PROVIDER_MODE: MOCK
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.5
          uv sync --frozen
          uv run --frozen pytest -q \
            packages/python-runtime/tests/test_alpha_g2_safety.py \
            packages/python-runtime/tests/test_alpha_cognitive_*.py

      - name: Enforce no live/material capability in G2 implementation
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            packages/python-runtime/src/soaiacore_runtime/safety_governance.py
            packages/python-runtime/tests/test_alpha_g2_safety.py
            packages/python-runtime/golden/soa-alpha-golden-safety-v0.1.json
          )
          ! grep -E -i 'postgresql://|client_secret|api[_-]?key|sk-proj-|az[[:space:]]+(group|network|containerapp|postgres)|terraform[[:space:]]+(apply|destroy)|Microsoft\.App/jobs/start' "${targets[@]}"
          ! grep -E -i 'requests\.(post|put|patch|delete)|httpx\.(post|put|patch|delete)|subprocess\.(run|Popen)|os\.system' "${targets[@]}"

      - name: Record deterministic G2 gate
        run: |
          echo 'G2_SAFETY_GOLDEN_STATIC=PASS'
          echo 'ZERO_TOLERANCE_INVARIANTS=6'
          echo 'STALE_R2_APPROVAL_TEST=true'
          echo 'R3_UNAVAILABLE_TEST=true'
          echo 'INJECTED_POLICY_BYPASS_TEST=true'
          echo 'RETRY_IDEMPOTENCY_TEST=true'
          echo 'REAL_SECRETS_IN_DATASET=false'
          echo 'PERSONAL_PAYLOAD_IN_DATASET=false'
          echo 'EXTERNAL_PROVIDER_CALLS=0'
          echo 'AZURE_MUTATION=false'
          echo 'TERRAFORM_EXECUTION=false'
          echo 'LIVE_DATABASE_MUTATION=false'
          echo 'R2_R3_ACTION_EXECUTION=false'
