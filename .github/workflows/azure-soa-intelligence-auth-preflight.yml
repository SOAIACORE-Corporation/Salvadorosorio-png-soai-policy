name: Azure SOA Intelligence Auth Preflight

on:
  push:
    branches:
      - feature/soa-intelligence-a2-postgres-20260906-r2
      - main
    paths:
      - .github/workflows/azure-soa-intelligence-auth-preflight.yml
      - scripts/azure/Bootstrap-SOAIntelligenceGitHubOidc.ps1

permissions:
  id-token: write
  contents: read

env:
  AZURE_CORE_OUTPUT: none
  AZURE_CLIENT_ID: 62a6c6fd-3d8a-4fb2-a17a-56fc7cf1ada2
  AZURE_TENANT_ID: a586520f-832e-4e56-9bc4-923cd77fb52b
  AZURE_SUBSCRIPTION_ID: 108eb4dd-25b3-4a7f-8d5e-4ec4389c3f0d

jobs:
  azure-read-only-preflight:
    name: Azure OIDC and backend read-only preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Azure login with branch-scoped OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify subscription context without emitting identifiers
        shell: bash
        run: |
          set -euo pipefail
          az account show >/dev/null
          echo 'AZURE_OIDC_LOGIN=PASS'
          echo 'AZURE_SUBSCRIPTION_CONTEXT=PASS'

      - name: Verify governed Terraform backend management-plane resources
        shell: bash
        run: |
          set -euo pipefail
          az group show --name rg-soaiacore-tfstate-34utxi >/dev/null
          az storage account show \
            --resource-group rg-soaiacore-tfstate-34utxi \
            --name stsoaiacoretf34utxi >/dev/null
          echo 'STATE_RESOURCE_GROUP_READ=PASS'
          echo 'STATE_STORAGE_ACCOUNT_READ=PASS'

      - name: Verify Terraform state container data-plane access
        shell: bash
        env:
          AZURE_CORE_OUTPUT: json
        run: |
          set -euo pipefail
          exists=$(az storage container exists \
            --auth-mode login \
            --account-name stsoaiacoretf34utxi \
            --name tfstate \
            --query exists \
            --output tsv)
          test "$exists" = "true"
          echo 'STATE_CONTAINER_EXISTS=PASS'
          echo 'STATE_DATA_PLANE_READ=PASS'

      - name: Record execution boundary
        shell: bash
        run: |
          echo 'OIDC_SUBJECT_SCOPE=TRUSTED_BRANCH_ONLY'
          echo 'AZURE_MUTATION=false'
          echo 'TERRAFORM_INIT=false'
          echo 'TERRAFORM_PLAN=false'
          echo 'TERRAFORM_APPLY=false'
          echo 'TERRAFORM_DESTROY=false'
          echo 'SOA_INTELLIGENCE_AZURE_AUTH_PREFLIGHT=PASS'
