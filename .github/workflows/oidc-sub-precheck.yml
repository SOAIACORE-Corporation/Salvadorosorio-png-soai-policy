name: OIDC Subject Precheck

on:
  push:
    branches:
      - security/p0-identity-2026-08-27
    paths:
      - .github/workflows/oidc-sub-precheck.yml

permissions:
  contents: read

jobs:
  observe-oidc-subject:
    name: Observe GitHub OIDC claims without Azure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Request and validate OIDC claims
        shell: bash
        env:
          EXPECTED_REPOSITORY: SOAIACORE-Corporation/Salvadorosorio-png-soai-policy
          EXPECTED_OWNER_ID: "244666106"
          EXPECTED_REPOSITORY_ID: "1062316959"
          EXPECTED_AUDIENCE: api://AzureADTokenExchange
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${EXPECTED_AUDIENCE}")"

          token="$(jq -r '.value' <<<"${response}")"
          test -n "${token}"
          test "${token}" != "null"

          payload_b64="$(cut -d. -f2 <<<"${token}" | tr '_-' '/+')"
          case $((${#payload_b64} % 4)) in
            2) payload_b64="${payload_b64}==" ;;
            3) payload_b64="${payload_b64}=" ;;
          esac
          payload="$(printf '%s' "${payload_b64}" | base64 --decode)"

          safe_claims="$(jq -c '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            ref_type,
            event_name,
            environment,
            job_workflow_ref,
            workflow_ref,
            runner_environment
          }' <<<"${payload}")"

          test "$(jq -r '.iss' <<<"${safe_claims}")" = "https://token.actions.githubusercontent.com"
          test "$(jq -r '.aud' <<<"${safe_claims}")" = "${EXPECTED_AUDIENCE}"
          test "$(jq -r '.repository' <<<"${safe_claims}")" = "${EXPECTED_REPOSITORY}"
          test "$(jq -r '.repository_owner_id' <<<"${safe_claims}")" = "${EXPECTED_OWNER_ID}"
          test "$(jq -r '.repository_id' <<<"${safe_claims}")" = "${EXPECTED_REPOSITORY_ID}"

          observed_sub="$(jq -r '.sub' <<<"${safe_claims}")"
          legacy_sub="repo:${EXPECTED_REPOSITORY}:ref:${GITHUB_REF}"
          immutable_sub="repo:SOAIACORE-Corporation@${EXPECTED_OWNER_ID}/Salvadorosorio-png-soai-policy@${EXPECTED_REPOSITORY_ID}:ref:${GITHUB_REF}"

          if [[ "${observed_sub}" == "${legacy_sub}" ]]; then
            subject_mode="LEGACY_DEFAULT"
          elif [[ "${observed_sub}" == "${immutable_sub}" ]]; then
            subject_mode="IMMUTABLE_DEFAULT"
          else
            subject_mode="CUSTOM_OR_UNEXPECTED"
          fi

          jq -n \
            --arg gate "OIDC_SUB_BRANCH_OBSERVED" \
            --arg subject_mode "${subject_mode}" \
            --argjson claims "${safe_claims}" \
            '{schema_version:"P0-OIDC-PRECHECK-1",gate:$gate,subject_mode:$subject_mode,azure_calls:0,token_logged:false,claims:$claims}' \
            > oidc-sub-precheck.json

          {
            echo '## OIDC precheck (no Azure)'
            echo
            echo "- Subject mode: \`${subject_mode}\`"
            echo "- Observed sub: \`${observed_sub}\`"
            echo '- Issuer: `https://token.actions.githubusercontent.com`'
            echo '- Audience: `api://AzureADTokenExchange`'
            echo '- Azure calls: `0`'
            echo '- Raw JWT logged: `NO`'
          } >> "${GITHUB_STEP_SUMMARY}"

          unset token response payload payload_b64

      - name: Upload OIDC precheck receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oidc-sub-precheck-${{ github.sha }}
          path: oidc-sub-precheck.json
          if-no-files-found: error
          retention-days: 30
