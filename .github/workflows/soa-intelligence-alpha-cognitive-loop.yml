name: SOA Intelligence Alpha Cognitive Loop

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/soa-intelligence-alpha-cognitive-loop.yml
      - packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py
      - packages/python-runtime/src/soaiacore_runtime/golden_eval.py
      - packages/python-runtime/tests/test_alpha_cognitive_*.py
      - schemas/cognitive-invocation-request-v0.1.schema.json
      - schemas/cognitive-output-v0.1.schema.json
      - schemas/golden-case-v0.1.schema.json
      - contracts/SOA_INTELLIGENCE_COGNITIVE_INVOCATION_v0.1.md
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - main
    paths:
      - .github/workflows/soa-intelligence-alpha-cognitive-loop.yml
      - packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py
      - packages/python-runtime/src/soaiacore_runtime/golden_eval.py
      - packages/python-runtime/tests/test_alpha_cognitive_*.py
      - schemas/cognitive-invocation-request-v0.1.schema.json
      - schemas/cognitive-output-v0.1.schema.json
      - schemas/golden-case-v0.1.schema.json
      - contracts/SOA_INTELLIGENCE_COGNITIVE_INVOCATION_v0.1.md
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: alpha-cognitive-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Alpha cognitive loop contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14

      - name: Compile Alpha cognitive loop
        run: |
          python -m py_compile \
            packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py \
            packages/python-runtime/src/soaiacore_runtime/golden_eval.py

      - name: Run contract and safety tests
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/python-runtime/src
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.5
          uv sync --frozen
          uv run --frozen pytest -q packages/python-runtime/tests/test_alpha_cognitive_*.py

      - name: Enforce non-material R1 boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E "az (group|network|containerapp|postgres).* (create|update|delete|start)" \
            packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py \
            packages/python-runtime/src/soaiacore_runtime/golden_eval.py \
            packages/python-runtime/tests
          ! grep -R -E "terraform (apply|destroy)|Microsoft\.App/jobs/start|public_network_access_enabled[[:space:]]*=[[:space:]]*true" \
            packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py \
            packages/python-runtime/src/soaiacore_runtime/golden_eval.py \
            packages/python-runtime/tests

      - name: Record gate
        run: |
          echo "ALPHA_COGNITIVE_LOOP_R1_STATIC=PASS"
          echo "G0_VERSIONED_SCHEMAS=true"
          echo "EXTERNAL_PROVIDER_CALLS=0"
          echo "AZURE_MUTATION=false"
          echo "LIVE_DATABASE_MUTATION=false"
          echo "R2_R3_ACTION_EXECUTION=false"
