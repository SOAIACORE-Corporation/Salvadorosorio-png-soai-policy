name: SOA Intelligence Alpha Cognitive Loop

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/soa-intelligence-alpha-cognitive-loop.yml
      - packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py
      - packages/python-runtime/src/soaiacore_runtime/golden_eval.py
      - packages/python-runtime/src/soaiacore_runtime/a2_context.py
      - packages/python-runtime/src/soaiacore_runtime/a2_persistence.py
      - packages/python-runtime/tests/test_alpha_cognitive_*.py
      - tests/test_alpha_cognitive_a2_e2e.py
      - db/migrations/**
      - db/a2_migrations/**
      - schemas/cognitive-invocation-request-v0.1.schema.json
      - schemas/cognitive-output-v0.1.schema.json
      - schemas/golden-case-v0.1.schema.json
      - contracts/SOA_INTELLIGENCE_COGNITIVE_INVOCATION_v0.1.md
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - main
    paths:
      - .github/workflows/soa-intelligence-alpha-cognitive-loop.yml
      - packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py
      - packages/python-runtime/src/soaiacore_runtime/golden_eval.py
      - packages/python-runtime/src/soaiacore_runtime/a2_context.py
      - packages/python-runtime/src/soaiacore_runtime/a2_persistence.py
      - packages/python-runtime/tests/test_alpha_cognitive_*.py
      - tests/test_alpha_cognitive_a2_e2e.py
      - db/migrations/**
      - db/a2_migrations/**
      - schemas/cognitive-invocation-request-v0.1.schema.json
      - schemas/cognitive-output-v0.1.schema.json
      - schemas/golden-case-v0.1.schema.json
      - contracts/SOA_INTELLIGENCE_COGNITIVE_INVOCATION_v0.1.md
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: alpha-cognitive-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Alpha cognitive loop contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: soaiacore
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soaiacore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14

      - name: Compile Alpha cognitive loop
        run: |
          python -m py_compile \
            packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py \
            packages/python-runtime/src/soaiacore_runtime/golden_eval.py \
            packages/python-runtime/src/soaiacore_runtime/a2_context.py

      - name: Run contract, safety, and disposable PostgreSQL E2E tests
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/python-runtime/src
          SOAIACORE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/soaiacore
          SOAIACORE_PROVIDER_MODE: MOCK
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.5
          uv sync --frozen
          uv run --frozen pytest -q \
            packages/python-runtime/tests/test_alpha_cognitive_*.py \
            tests/test_alpha_cognitive_a2_e2e.py

      - name: Enforce non-material R1 boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E "az (group|network|containerapp|postgres).* (create|update|delete|start)" \
            packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py \
            packages/python-runtime/src/soaiacore_runtime/golden_eval.py \
            packages/python-runtime/src/soaiacore_runtime/a2_context.py \
            packages/python-runtime/tests \
            tests/test_alpha_cognitive_a2_e2e.py
          ! grep -R -E "terraform (apply|destroy)|Microsoft\.App/jobs/start|public_network_access_enabled[[:space:]]*=[[:space:]]*true" \
            packages/python-runtime/src/soaiacore_runtime/cognitive_loop.py \
            packages/python-runtime/src/soaiacore_runtime/golden_eval.py \
            packages/python-runtime/src/soaiacore_runtime/a2_context.py \
            packages/python-runtime/tests \
            tests/test_alpha_cognitive_a2_e2e.py

      - name: Record gate
        run: |
          echo "ALPHA_COGNITIVE_LOOP_R1_STATIC=PASS"
          echo "G1_A2_READER_E2E=true"
          echo "GOLDEN_FUTURE_REF_NORMALIZATION=true"
          echo "DISPOSABLE_POSTGRES_E2E=true"
          echo "EXTERNAL_PROVIDER_CALLS=0"
          echo "AZURE_MUTATION=false"
          echo "LIVE_DATABASE_MUTATION=false"
          echo "R2_R3_ACTION_EXECUTION=false"
