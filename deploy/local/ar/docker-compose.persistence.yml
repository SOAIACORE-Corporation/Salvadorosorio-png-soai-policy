services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: soaiacore
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: soaiacore
    ports:
      - "5432:5432"
    volumes:
      - soaiacore_pgdata:/var/lib/postgresql/data
      - ../../../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soaiacore -d soaiacore"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  soaiacore_pgdata:
