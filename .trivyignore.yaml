vulnerabilities:
  - id: CVE-2026-13221
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.6"
    expired_at: 2026-08-31
    statement: >-
      Owner: GOV-CUST-01 executive custodian. P0-only, time-bounded acceptance.
      Technical basis: the Python and Node runtimes do not invoke Perl or compile
      attacker-controlled Perl regular expressions; the affected code is not in
      the execution path. Compensating control: linux/amd64 immutable images are
      rebuilt and rescanned before publication. Reassess before expiration; an
      expired exception is not authorized for deployment.
  - id: CVE-2026-42496
    purls:
